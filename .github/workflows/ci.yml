name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests (engine)
        run: npm test
      - name: Type check and production build
        run: npm run build
